name: Update KIA Lineups

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 6-14 * * *'

permissions:
  contents: write

concurrency:
  group: kia-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml
      - name: Update schedule and player data
        run: python scripts/sync_lineups.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lineup-data.json schedule-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update KIA schedule and lineup data"
            git push
          fi
